# Render Blueprint for the backend tier.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: litellm-chat-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEYS          # set in the dashboard, never in git
        sync: false
      - key: LLM_MODELS
        value: gemini/gemini-2.0-flash
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ALLOWED_ORIGINS       # your Vercel URL, set after the frontend is live
        sync: false
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: CACHE_TYPE
        value: disk
      - key: CACHE_DIR
        value: /data/cache
      - key: LOG_LEVEL
        value: INFO
    # A persistent disk needs a paid instance type. Uncomment to keep history
    # across deploys exactly like the local Docker volume does.
    # disk:
    #   name: app-data
    #   mountPath: /data
    #   sizeGB: 1
