services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: litellm-chat-backend:latest
    container_name: chat-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # key pool: at least two keys, ids are key_1, key_2, ... in this order
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODELS: ${LLM_MODELS:-gemini/gemini-2.0-flash}
      # SQLite file on the named volume -> history survives restarts
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TYPE: ${CACHE_TYPE:-disk}
      CACHE_DIR: ${CACHE_DIR:-/data/cache}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-604800}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1024}
      MAX_HISTORY_MESSAGES: ${MAX_HISTORY_MESSAGES:-40}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - app-data:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    image: litellm-chat-frontend:latest
    container_name: chat-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # injected into the static bundle at container start
      API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      - backend

volumes:
  app-data:
    name: litellm-chat-data
